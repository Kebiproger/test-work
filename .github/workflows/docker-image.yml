name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      #contents: read
      packages: write
    outputs:
      # Эти значения будут доступны job deploy needs.build.outputs.*
      prefix: ${{ steps.names.outputs.prefix }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Compute image names
      id: names # steps.<id> = steps.name.outputs.<variables>
      run: | 
        owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
        echo "tag=sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7 )" >> "$GITHUB_OUTPUT"
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
                         
                         #buildx включает кэш слоёв
    - uses: docker/setup-buildx-action@v3 
    - name: Build backend
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.names.outputs.prefix }}/flower-backend:${{ steps.names.outputs.tag }}
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha, scope=backend
        cache-to: type=gha,mode=max,scope=backend
    - name: Build Frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.names.outputs.prefix }}/flower-frontend:${{ steps.names.outputs.tag }}
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      #contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
    - name: Deploy
      run: sh scripts/deploy.sh
      env:
        DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        IMAGE_PREFIX: ${{ needs.build.outputs.prefix }}
        TAG: ${{ needs.build.outputs.tag }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
