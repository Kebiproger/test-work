# Thin wrapper: all logic lives in the Makefile and ci/*.sh (see ci/README.md).
name: CI/CD

on: {push: {branches: [main]}, pull_request: {branches: [main]}}

permissions: {contents: read}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}  # full history so the gitleaks scan covers all commits
      - run: make lint scan

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs: {REGISTRY: "${{ steps.contract.outputs.REGISTRY }}", TAG: "${{ steps.contract.outputs.TAG }}"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: contract  # REGISTRY/TAG go to GITHUB_ENV (make) and to job outputs (deploy)
        run: printf 'REGISTRY=ghcr.io/%s\nTAG=sha-%s\n' "$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" "$(echo "$GITHUB_SHA" | cut -c1-7)" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT" >/dev/null
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: make build
      - if: github.event_name != 'pull_request'
        run: make push

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions: {contents: read, packages: read}
    concurrency: {group: deploy-production, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make deploy
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          REGISTRY: ${{ needs.build.outputs.REGISTRY }}
          TAG: ${{ needs.build.outputs.TAG }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
