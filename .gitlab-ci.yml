# Thin wrapper: all logic lives in the Makefile and ci/*.sh (see ci/README.md).
# Same make targets and variable names as .github/workflows/ci-cd.yml.
# build uses Docker-in-Docker (privileged runner). check installs pinned tools without Docker.
# Image versions must match ci/versions.env (GitLab cannot read that file): alpine:3.21.10, docker:27.5-*.

stages: [check, build, deploy]

variables:
  APP: flower
  REGISTRY: $CI_REGISTRY_IMAGE
  TAG: sha-$CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: "/certs"

.docker:
  image: docker:27.5-cli
  services:
    - docker:27.5-dind
  before_script:
    - apk add --no-cache make

check:
  stage: check
  image: alpine:3.21.10
  variables:
    GIT_DEPTH: "0"  # full history for the gitleaks scan
  before_script:
    - apk add --no-cache make git curl
    - sh ci/install-tools.sh
  script:
    - make lint scan

build:
  stage: build
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make build
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        make push
      fi

deploy:
  stage: deploy
  tags: [vm-runner]
  environment: production
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_TOKEN: $CI_REGISTRY_PASSWORD
  script:
    - make deploy
